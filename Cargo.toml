[package]
name = "basis_transcoder"
authors = ["jiang heng <https://github.com/jiangheng90/"]
version = "0.1.0"
description = "A Basis Universal KTX2 transcoder on rust, with native and WebAssembly support (wip)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jiangheng90-opensource/basis_transcoder"
homepage = "https://github.com/jiangheng90-opensource/basis_transcoder"
edition = "2024"
include = [
    "src/**",
    "cpp/**",
    "include/**",
    "build.rs",
    "javascript/index.es.js",
    "third_party/basis_universal/transcoder/**",
    "testdata/texture_0.ktx2",
    "examples/decode_to_png.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cxx = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4"
once_cell = "1.19"

[dev-dependencies]
image = "0.25"
tokio = { version = "1.47", features = ["full"] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
cxx-build = "1.0"
cc = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "decode_to_png"
path = "examples/decode_to_png.rs"
required-features = []
